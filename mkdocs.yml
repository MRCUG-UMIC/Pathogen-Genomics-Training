site_name: Pathogen Genomics
site_description: From Reads to Outbreaks - a practical viral genomics workshop
site_url: https://mrcug-umic.github.io/Pathogen-Genomics-Training/
repo_url: https://github.com/MRCUG-UMIC/Pathogen-Genomics-Training
repo_name: MRCUG-UMIC/Pathogen-Genomics-Training
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Workshop: index.md
